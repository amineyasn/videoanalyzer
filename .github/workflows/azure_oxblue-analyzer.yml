name: Deploy OxBlue Analyzer to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:   # allows manual trigger from GitHub Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3. Install dependencies into a local folder
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      # 4. Deploy everything to Azure Web App
      #    The AZURE_WEBAPP_PUBLISH_PROFILE secret is downloaded from Azure Portal:
      #    Web App → Overview → Download publish profile
      #    Then add it as a GitHub secret named AZURE_WEBAPP_PUBLISH_PROFILE
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'oxblue-analyzer'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
